[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agterm-win"
version = "0.1.0"
description = "AI agent terminal for WSL/WSLg with Windows toast notifications"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agterm = "agterm.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agterm*"]
